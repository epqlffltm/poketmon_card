# .github/workflows/ci.yml
#
# 린트와 테스트를 자동 실행한다.
#
# 통합 테스트가 실제 PostgreSQL 을 요구하므로 서비스 컨테이너를 띄운다.
# NULLS NOT DISTINCT 는 PostgreSQL 15 이상에서만 동작하므로 버전을 고정한다.
# 이 값을 낮추면 오류 없이 중복 스냅샷이 쌓이므로, 버전 고정 자체가 검증의 일부다.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # docker-compose.yml 의 postgres:16-alpine 과 메이저 버전을 맞춘다
        image: postgres:16-alpine
        env:
          POSTGRES_USER: poke
          POSTGRES_PASSWORD: poke
          POSTGRES_DB: pokecard
          TZ: UTC
        ports:
          - 5432:5432
        # 컨테이너가 뜬 것과 접속 가능한 것은 다르다.
        # healthcheck 없이는 DB 준비 전에 테스트가 시작되어 간헐적으로 실패한다.
        options: >-
          --health-cmd "pg_isready -U poke -d pokecard"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://poke:poke@localhost:5432/pokecard

    steps:
      - uses: actions/checkout@v4

      - name: uv 설치
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 파이썬 설치
        # .python-version 을 읽어 로컬과 동일한 버전을 사용한다
        run: uv python install

      - name: 의존성 설치
        # --frozen: uv.lock 을 갱신하지 않고 그대로 사용한다.
        # lock 과 pyproject 가 어긋나 있으면 여기서 실패해야 한다.
        run: uv sync --frozen

      - name: 린트
        run: uv run ruff check .

      - name: 포맷 검사
        run: uv run ruff format --check .

      - name: 마이그레이션 검증
        # 테스트는 metadata 로 스키마를 만들므로 마이그레이션을 거치지 않는다.
        # 체인이 깨져도 테스트는 통과할 수 있어 별도 스텝으로 검증한다.
        run: uv run alembic upgrade head

      - name: 테스트
        run: uv run pytest -q